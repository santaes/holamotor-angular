services:
  holamotor:
    build: .
    image: holamotor:latest
    container_name: holamotor
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Madrid
      - LIBRETRANSLATE_URL=http://host.docker.internal:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on since LibreTranslate runs on host
