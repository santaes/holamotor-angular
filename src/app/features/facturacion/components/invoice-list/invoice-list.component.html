<div class="invoice-list-container">
  <div class="header-section">
    <h1>Facturación</h1>
    <button mat-raised-button color="primary" (click)="createInvoice()">
      <mat-icon>add</mat-icon>
      Nueva Factura
    </button>
  </div>

  <div class="table-section" *ngIf="!isLoading; else loading">
    <mat-card>
      <table mat-table [dataSource]="invoices" class="invoice-table">
        <ng-container matColumnDef="numeroFactura">
          <th mat-header-cell *matHeaderCellDef>Número</th>
          <td mat-cell *matCellDef="let invoice">
            <strong>{{ invoice.numeroFactura }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="clienteNombre">
          <th mat-header-cell *matHeaderCellDef>Cliente</th>
          <td mat-cell *matCellDef="let invoice">{{ invoice.clienteNombre }}</td>
        </ng-container>

        <ng-container matColumnDef="fechaEmision">
          <th mat-header-cell *matHeaderCellDef>Fecha Emisión</th>
          <td mat-cell *matCellDef="let invoice">{{ invoice.fechaEmision | date:'shortDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let invoice">
            <strong>${{ invoice.total.toFixed(2) }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let invoice">
            <mat-chip [style.background-color]="getEstadoColor(invoice.estado)" class="status-chip">
              {{ invoice.estado }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let invoice">
            <button mat-icon-button (click)="viewInvoice(invoice.id)" matTooltip="Ver detalles">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button (click)="editInvoice(invoice.id)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteInvoice(invoice.id)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <div class="no-data" *ngIf="invoices.length === 0">
        <mat-icon>receipt</mat-icon>
        <p>No hay facturas registradas</p>
      </div>
    </mat-card>
  </div>

  <ng-template #loading>
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Cargando facturas...</p>
    </div>
  </ng-template>
</div>
