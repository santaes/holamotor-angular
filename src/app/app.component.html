<mat-sidenav-container class="app-container">
  <mat-sidenav
    [opened]="isSidebarOpen"
    mode="side"
    class="sidebar"
    [class.collapsed]="!isSidebarOpen">
    <div class="sidebar-header">
      <mat-icon class="logo-icon">directions_car</mat-icon>
      <h2 *ngIf="isSidebarOpen">HolaMotor</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item
         *ngFor="let item of menuItems"
         (click)="navigate(item.route)"
         [class.mat-list-item-active]="isActive(item.route)">
        <mat-icon mat-list-icon>{{ item.icon }}</mat-icon>
        <span *ngIf="isSidebarOpen">{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar class="app-toolbar" color="primary">
      <button
        mat-icon-button
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-spacer"></span>
      <button mat-icon-button aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-icon-button aria-label="Settings">
        <mat-icon>settings</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>

    <footer class="app-footer">
      <p>&copy; {{ currentYear }} HolaMotor Taller - Sistema de Gestión de Taller Mecánico</p>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
